<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التحقق من الهوية</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wasfa/components/bundle.css">
<script src="ds/wasfa/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{
  --surface-app:#f5f7fa; --surface-card:#ffffff; --navy:#062958; --navy-soft:#0b356f;
  --navy-tint:#e8eef7; --ink-muted:#55637a; --border:#e2e8f1; --border-strong:#7d8da6;
  --danger:#d5272c; --warning:#8a5200; --success:#0e7c61; --on-fill:#ffffff;
  --font-sans:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-full:999px;
  --shadow-sm:0 1px 2px rgba(6,41,88,.10), 0 1px 1px rgba(6,41,88,.06);
  --shadow-md:0 8px 24px rgba(6,41,88,.18), 0 2px 6px rgba(6,41,88,.10);
}
body{margin:0;font-family:var(--font-sans);color:var(--navy);background:var(--surface-app)}
a{color:var(--navy-soft)} a:hover{color:var(--navy)}
h1,h2,h3,p{margin:0}
.sec{font-size:20px;line-height:28px;font-weight:600;color:var(--navy)}
.cap{font-size:13px;line-height:18px;color:var(--ink-muted)}
.sm{font-size:14px;line-height:20px;color:var(--ink-muted)}
.bd{font-size:17px;line-height:26px}
.bs{font-size:17px;line-height:26px;font-weight:600}
.scroll{flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:16px}
.timehead{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.02em;color:var(--ink-muted);padding-block:4px}
.timehead::after{content:"";flex-grow:1;height:1px;background:var(--border)}
.doserow{display:flex;align-items:center;gap:12px;background:var(--surface-card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm)}
.menurow{display:flex;align-items:center;gap:12px;background:var(--surface-card);border-bottom:1px solid var(--border);padding:14px 16px;min-height:44px}
.frame{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface-app);overflow:hidden;border:1px solid var(--border)}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface-app);overflow:hidden;">

  <div style="flex-grow:1;display:flex;flex-direction:column;gap:24px;padding:32px 16px;justify-content:center;">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span class="cap">محاكاة لتدفق الهوية الوطنية · ليس ربطًا حقيقيًا</span>
      <h1 style="font-size:32px;line-height:40px;font-weight:600;">أدويتك في مكان واحد</h1>
      <p class="bd" style="color:var(--ink-muted);">أدخل الرقم المدني للدخول. بعدها يوصلك طلب موافقة على تطبيق هويّاتي.</p>
    </div>
    <x-import component-from-global-scope="Wasfa.TextField" label="الرقم المدني" value="255031200187"
      dir="ltr" inputMode="numeric" helper-text="أرقام تجريبية فقط في هذه النسخة" lang="ar"></x-import>
    <x-import component-from-global-scope="Wasfa.Button" variant="primary" size="lg" full-width="{{yes}}"
      icon="shield" lang="ar">متابعة</x-import>
    <div style="background:var(--surface-card);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:var(--shadow-sm);">
      <span class="bs">افتح تطبيق هويّاتي ووافق</span>
      <div style="width:96px;height:96px;border-radius:999px;border:6px solid var(--navy-tint);border-top-color:var(--navy);display:flex;align-items:center;justify-content:center;">
        <span style="font-size:26px;line-height:34px;font-weight:600;">٢٣</span>
      </div>
      <span class="cap">تنتهي المهلة بعد ٢٣ ثانية · تقدر تلغي وترجع</span>
      <x-import component-from-global-scope="Wasfa.Button" variant="quiet" lang="ar">إلغاء</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      tabs: [
        { id: 'today', label: 'اليوم', icon: 'clock' },
        { id: 'meds', label: 'أدويتي', icon: 'capsule' },
        { id: 'safety', label: 'السلامة', icon: 'shield' },
        { id: 'more', label: 'المزيد', icon: 'settings' }
      ],
      rxWar: { drug: { genericName: 'Warfarin', brandName: 'Marevan', strengthMg: 5 }, source: { facilityName: 'مستشفى الفروانية', sector: 'public' } },
      rxIbu: { drug: { genericName: 'Ibuprofen', brandName: 'Brufen', strengthMg: 400 }, source: { facilityName: 'عيادة النخبة الطبية', sector: 'private' } },
      rxMet: { drug: { genericName: 'Metformin', brandName: 'Glucophage', strengthMg: 500 }, source: { facilityName: 'مستشفى الفروانية', sector: 'public' } },
      rxAmo: { drug: { genericName: 'Amoxicillin', brandName: 'Amoxil', strengthMg: 500 }, source: { facilityName: 'عيادة النخبة الطبية', sector: 'private' } },
      dUp: { status: 'upcoming' }, dOn: { status: 'taken_on_time' },
      dLate: { status: 'taken_late' }, dMiss: { status: 'missed' },
      noop: function () {}
    };
  }
}
</script>
</body>
</html>
